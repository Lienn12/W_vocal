server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/manifest+json text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Mọi yêu cầu /api được chuyển sang API Node.js, nên trình duyệt chỉ thấy một tên miền.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # File đã build có tên chứa mã băm, nên có thể lưu đệm lâu dài.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # Service worker và manifest không được lưu đệm lâu để cập nhật phiên bản mới ngay.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Ứng dụng một trang: mọi đường dẫn khác đều trả về index.html để React Router xử lý.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
